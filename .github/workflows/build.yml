name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Сборка
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong" -A3 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Имя файла
        run: cp app/build/outputs/apk/release/app-release.apk Napravleniya-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Napravleniya-${{ github.run_number }}
          path: Napravleniya-*.apk

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Направления, сборка ${{ github.run_number }}
          body: Скачайте файл APK ниже и откройте его на телефоне.
          files: Napravleniya-*.apk
          make_latest: true
